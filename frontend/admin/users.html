<!DOCTYPE html>
<html>

<head>

    <title>Users Management</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<div class="page-container">

    <div class="page-header">

        <h1>Users Management</h1>

        <a class="back-btn"
           href="dashboard.html">
            Dashboard
        </a>

    </div>

    <!-- Search -->

    <div class="card">

        <h3>Search Users</h3>

        <div class="form-row">

            <input
                type="text"
                id="search"
                placeholder="Search by name or email">

            <button onclick="loadUsers()">
                Search
            </button>

        </div>

    </div>

    <!-- Form -->

    <div class="card">

        <h3>Add / Edit User</h3>

        <input
            type="hidden"
            id="user_id">

        <div class="form-grid">

            <input
                type="text"
                id="full_name"
                placeholder="Full Name">

            <input
                type="email"
                id="email"
                placeholder="Email">

            <input
                type="password"
                id="password"
                placeholder="Password">

            <select id="role">

                <option value="admin">
                    Admin
                </option>

                <option value="lecturer">
                    Lecturer
                </option>

                <option value="student">
                    Student
                </option>

            </select>

        </div>

        <div class="button-group">

            <button onclick="saveUser()">
                Save User
            </button>

            <button
                class="secondary-btn"
                onclick="clearForm()">
                Clear
            </button>

        </div>

        <p id="message"></p>

    </div>

    <!-- Table -->

    <div class="card">

        <h3>User List</h3>

        <table class="data-table">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Role</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="userTable">

            </tbody>

        </table>
        <div class="pagination">

    <button
        id="prevBtn"
        onclick="previousPage()">

        Previous

    </button>

    <span id="pageInfo">

        Page 1

    </span>

    <button
        id="nextBtn"
        onclick="nextPage()">

        Next

    </button>

</div>

    </div>

</div>



<script src="../js/users.js"></script>

</body>
</html>
