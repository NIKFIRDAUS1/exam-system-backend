<!DOCTYPE html>
<html>

<head>

    <title>Examinations Management</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<div class="page-container">

    <div class="page-header">

        <h1>Examinations Management</h1>

        <a class="back-btn"
           href="dashboard.html">

            Dashboard

        </a>

    </div>

    <!-- Search -->

    <div class="card">

        <h3>Search Examination</h3>

        <div class="form-row">

            <input
                type="text"
                id="search"
                placeholder="Search course or venue">

            <button onclick="loadExams()">

                Search

            </button>

        </div>

    </div>

    <!-- Form -->

    <div class="card">

        <h3>Add / Edit Examination</h3>

        <input
            type="hidden"
            id="exam_id">

        <div class="form-grid">

            <select id="course_id">
            </select>

            <select id="venue_id">
            </select>

            <input
                type="date"
                id="exam_date">

            <input
                type="time"
                id="exam_time">

        </div>

        <div class="button-group">

            <button onclick="saveExam()">

                Save Examination

            </button>

            <button
                class="secondary-btn"
                onclick="clearForm()">

                Clear

            </button>

        </div>

        <p id="message"></p>

    </div>

    <!-- Table -->

    <div class="card">

        <h3>Examination List</h3>

        <table class="data-table">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Course</th>

                    <th>Venue</th>

                    <th>Date</th>

                    <th>Time</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="examTable">

            </tbody>

        </table>

        <div class="pagination">

            <button
                id="prevBtn"
                onclick="previousPage()">

                Previous

            </button>

            <span id="pageInfo">

                Page 1

            </span>

            <button
                id="nextBtn"
                onclick="nextPage()">

                Next

            </button>

        </div>

    </div>

</div>

<script src="../js/examinations.js"></script>

</body>
</html>
