<!DOCTYPE html>
<html>

<head>

    <title>My Results</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<div class="page-container">

    <div class="page-header">

        <h1>My Results</h1>

        <a class="back-btn"
           href="dashboard.html">
            Dashboard
        </a>

    </div>

    <!-- Search -->

    <div class="card">

        <h3>Search Results</h3>

        <div class="form-row">

            <input
                type="text"
                id="search"
                placeholder="Search Course">

            <button onclick="loadResults()">
                Search
            </button>

        </div>

    </div>

    <!-- Result Table -->

    <div class="card">

        <h3>Result List</h3>

        <table class="data-table">

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Course Code</th>
                    <th>Course Name</th>
                    <th>Marks</th>
                    <th>Grade</th>

                </tr>

            </thead>

            <tbody id="resultTable">
            </tbody>

        </table>

        <div class="pagination">

            <button
                id="prevBtn"
                onclick="previousPage()">

                Previous

            </button>

            <span id="pageInfo">

                Page 1

            </span>

            <button
                id="nextBtn"
                onclick="nextPage()">

                Next

            </button>

        </div>

    </div>

</div>

<script src="../js/student-results.js"></script>

</body>
</html>
