<!DOCTYPE html>
<html>

<head>

    <title>My Examinations</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<div class="page-container">

    <div class="page-header">

        <h1>My Examinations</h1>

        <a class="back-btn"
           href="dashboard.html">

            Dashboard

        </a>

    </div>

    <!-- Search -->

    <div class="card">

        <h3>Search Examination</h3>

        <div class="form-row">

            <input
                type="text"
                id="search"
                placeholder="Search course or venue">

            <button onclick="loadExams()">

                Search

            </button>

        </div>

    </div>

    <!-- Table -->

    <div class="card">

        <h3>Examination Timetable</h3>

        <table class="data-table">

            <thead>

                <tr>

                    <th>Course</th>

                    <th>Venue</th>

                    <th>Date</th>

                    <th>Time</th>

                </tr>

            </thead>

            <tbody id="examTable">

            </tbody>

        </table>

        <div class="pagination">

            <button
                id="prevBtn"
                onclick="previousPage()">

                Previous

            </button>

            <span id="pageInfo">

                Page 1

            </span>

            <button
                id="nextBtn"
                onclick="nextPage()">

                Next

            </button>

        </div>

    </div>

</div>

<script src="../js/student-examinations.js"></script>

</body>
</html>
