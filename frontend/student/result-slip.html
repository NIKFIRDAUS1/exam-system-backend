<!DOCTYPE html>
<html>

<head>

    <title>Result Slip QR</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<div class="page-container">

    <div class="page-header">

        <h1>Result Slip QR</h1>

        <a class="back-btn"
           href="dashboard.html">
            Dashboard
        </a>

    </div>

    <div class="card">

        <div
            id="qrContainer"
            style="text-align:center;">
        </div>

        <p
            style="text-align:center; margin-top:20px;">
            Scan this QR Code to view the complete result slip.
        </p>

    </div>

<div style="text-align:center; margin-top:20px;">

    <button onclick="printSlip()">
        Print Result Slip
    </button>

</div>

</div>

<script src="../js/result-slip.js"></script>

</body>
</html>
