<!DOCTYPE html>
<html>

<head>

    <title>Lecturer Notifications</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<div class="page-container">

    <div class="page-header">

        <h1>Lecturer Notifications</h1>

        <a class="back-btn"
           href="dashboard.html">
            Dashboard
        </a>

    </div>

    <!-- Search -->

    <div class="card">

        <h3>Search Notifications</h3>

        <div class="form-row">

            <input
                type="text"
                id="search"
                placeholder="Search student or message">

            <button onclick="loadNotifications()">
                Search
            </button>

        </div>

    </div>

    <!-- Form -->

    <div class="card">

        <h3>Send Notification</h3>

        <div class="form-grid">

            <select id="user_id">
            </select>

            <textarea
                id="notification_message"
                placeholder="Notification Message"
                rows="4">
            </textarea>

        </div>

        <div class="button-group">

            <button onclick="saveNotification()">
                Send Notification
            </button>

        </div>

        <p id="message"></p>

    </div>

    <!-- Table -->

    <div class="card">

        <h3>Notification List</h3>

        <table class="data-table">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>User</th>

                    <th>Message</th>

                    <th>Created At</th>

                </tr>

            </thead>

            <tbody id="notificationTable">
            </tbody>

        </table>

        <div class="pagination">

            <button
                id="prevBtn"
                onclick="previousPage()">

                Previous

            </button>

            <span id="pageInfo">

                Page 1

            </span>

            <button
                id="nextBtn"
                onclick="nextPage()">

                Next

            </button>

        </div>

    </div>

</div>

<script src="../js/lecturer-notifications.js"></script>

</body>
</html>
